<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘의 경제</title>
<meta name="description" content="매일 아침 갱신되는 한국·미국 증시 시황과 경제 뉴스 브리핑">
<!-- 개인용 페이지 — 검색 결과에 노출되지 않게 한다 (주소를 아는 사람만 열람).
     프로젝트 Pages 는 robots.txt 가 도메인 루트에서만 읽히므로 이 메타 태그가 실제로 일하는 쪽이다. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#F2F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1420" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘의 경제">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <header class="topbar" id="topbar">
    <div class="topbar-in">
      <div class="brand">
        <img class="brand-mark" src="icons/icon-192.png" alt="" width="26" height="26">
        <div class="brand-text">
          <span class="brand-name" id="brandName">오늘의 경제</span>
          <span class="brand-sub" id="brandSub">불러오는 중…</span>
        </div>
      </div>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="새로고침">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-.6 4M20 5v6h-6"/></svg>
      </button>
    </div>
    <div class="sync" id="sync" hidden></div>
  </header>

  <main class="views" id="views">
    <section class="view" id="view-market" role="tabpanel" aria-labelledby="tab-market"></section>
    <section class="view" id="view-news" role="tabpanel" aria-labelledby="tab-news" hidden></section>
    <section class="view" id="view-archive" role="tabpanel" aria-labelledby="tab-archive" hidden></section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="섹션">
    <button class="tab is-on" id="tab-market" role="tab" data-tab="market" aria-selected="true" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10M9.5 19V5M15 19v-7M20.5 19v-11"/></svg>
      <span>시황</span>
    </button>
    <button class="tab" id="tab-news" role="tab" data-tab="news" aria-selected="false" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h13v14H5.5A1.5 1.5 0 0 1 4 17.5zM17 9h3v8.5a1.5 1.5 0 0 1-3 0zM7 8.5h7M7 12h7M7 15.5h4"/></svg>
      <span>뉴스</span>
    </button>
    <button class="tab" id="tab-archive" role="tab" data-tab="archive" aria-selected="false" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v12H4zM4 7l1.2-3h13.6L20 7M9.5 11.5h5"/></svg>
      <span>지난 호</span>
    </button>
  </nav>

</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="install" id="install" hidden>
  <div class="install-txt">
    <b>홈 화면에 추가</b>
    <span id="installHint">앱처럼 아이콘으로 바로 열 수 있어요.</span>
  </div>
  <div class="install-act">
    <button class="btn" id="installBtn" type="button" hidden>설치</button>
    <button class="btn ghost" id="installClose" type="button">닫기</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
